    question: What kind of AI work can Cadre AI help with?
    history: []
    expected_source_ids: [eval-services]
    must_abstain: false
  - case_id: maturity-direct
    question: What is the AI Maturity Index used for?
    history: []
    expected_source_ids: [eval-maturity]
    must_abstain: false
  - case_id: portal-direct
    question: Where do existing clients access their project workspace?
    history: []
    expected_source_ids: [eval-portal]
    must_abstain: false
