version: 1
sources:
  - source_id: eval-services
    title: Synthetic services fixture
    text: >-
      Cadre AI helps organizations define an AI strategy, prioritize practical use cases,
      and deliver AI systems with engineering and leadership support.
  - source_id: eval-maturity
    title: Synthetic AI maturity fixture
    text: >-
      The AI Maturity Index is an assessment used to understand organizational readiness
      and identify practical next steps for adopting artificial intelligence.
  - source_id: eval-portal
    title: Synthetic portal fixture
    text: >-
      Existing clients use the client portal to access their project workspace and shared
      delivery materials. Account-specific access problems require verified support guidance.
cases:
